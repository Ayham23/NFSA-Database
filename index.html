<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3d1c">
<title>مفتش الأغذية — القليوبية</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash">
  <div class="splash-mark">
    <img src="logo.png" alt="الهيئة القومية لسلامة الغذاء" class="splash-logo">
  </div>
  <p class="splash-title">الهيئة القومية لسلامة الغذاء</p>
  <p class="splash-sub">ادارة الرقابة على السوق المحلي</p>
  <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  <p class="splash-status" id="splash-status">جاري تحميل قاعدة البيانات...</p>
</div>

<div id="app">

  <div class="topbar">
    <p class="topbar-title">قاعدة بيانات منشآت القليوبية</p>
    <p class="topbar-sub" id="topbar-sub">هيئة سلامة الغذاء</p>
  </div>

  <div id="app-screens" class="screen" style="padding-bottom:0;">

    <!-- SEARCH SCREEN -->
    <div id="screen-search">
      <div class="search-wrap">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input" placeholder="ابحث بالاسم أو الكود أو العنوان...">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M20 20L15.2 15.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        </div>
        <div class="filter-row">
          <select id="filter-center" class="filter-select">
            <option value="">كل المراكز</option>
          </select>
          <select id="filter-risk" class="filter-select">
            <option value="">كل مستويات الخطورة</option>
            <option value="High">مرتفعة</option>
            <option value="Medium">متوسطة</option>
            <option value="Low">منخفضة</option>
          </select>
        </div>
      </div>
      <div id="result-count" class="result-count"></div>
      <div id="facility-list" class="facility-list"></div>
    </div>

    <!-- DETAIL SCREEN -->
    <div id="screen-detail" class="hidden">
      <div class="detail-header">
        <button class="back-btn" id="back-from-detail"><span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14.5 6L8 12.5L14.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span> رجوع للبحث</button>
        <p class="detail-title" id="detail-name"></p>
        <span class="risk-badge" id="detail-risk-badge"></span>
      </div>
      <div class="detail-body">
        <div class="danger-note hidden" id="danger-note">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4L21.5 20.5H2.5L12 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10V14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1" fill="currentColor"/></svg></span>
          يوجد خطر داهم
        </div>
        <div class="followup-box" id="followup-box">
          <div class="followup-info">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M12 7.5V12.3L15.2 14.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span id="followup-date-text">لم تتم متابعتها بعد</span>
          </div>
          <button class="btn-followup" id="btn-mark-followup">تم المتابعة اليوم</button>
        </div>
        <button class="btn-danger" id="btn-toggle-danger">يوجد خطر داهم</button>
        <div class="info-grid" id="detail-info-grid"></div>
        <button class="btn-primary" id="btn-new-inspection"><span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span> تسجيل زيارة تفتيش جديدة</button>
        <p class="section-title" style="margin-top:20px;"><span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5.5" y="4.5" width="13" height="16" rx="1.2" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="3" width="6" height="3" rx="0.8" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 11H15.5M8.5 14.5H15.5M8.5 17.5H12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span> الزيارات المسجّلة على هذا الجهاز</p>
        <div id="detail-logs"></div>
      </div>
    </div>

    <!-- FORM SCREEN -->
    <div id="screen-form" class="hidden">
      <div class="detail-header">
        <button class="back-btn" id="back-from-form"><span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14.5 6L8 12.5L14.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span> رجوع لبيانات المنشأة</button>
        <p class="detail-title" id="form-title">تسجيل زيارة جديدة</p>
        <p style="font-size:13px;color:var(--muted);margin:0;" id="form-facility-name"></p>
        <p class="facility-code" id="form-facility-code" style="margin-top:2px;"></p>
      </div>
      <div class="detail-body">
        <form id="inspection-form">
          <div class="form-group">
            <label class="form-label">اسم القائم بالتفتيش</label>
            <input type="text" id="inspector-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">تاريخ الزيارة</label>
            <input type="date" id="inspection-date" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">تقييم مستوى الخطورة</label>
            <div class="radio-group" id="risk-options"></div>
          </div>
          <div class="form-group">
            <label class="form-label">حالة المتابعة</label>
            <select id="followup-status" class="form-select">
              <option value="open">متابعة مطلوبة</option>
              <option value="closed">تمت المتابعة / مغلقة</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الملاحظات</label>
            <textarea id="inspection-notes" class="form-textarea" placeholder="اكتب نتائج الزيارة والملاحظات هنا..."></textarea>
          </div>
          <button type="submit" class="btn-primary">حفظ الزيارة</button>
        </form>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-search">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M20 20L15.2 15.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span>البحث</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
